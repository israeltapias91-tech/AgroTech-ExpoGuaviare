; Configuración de ejemplo — ExpoGuaviare AgroTech (Fase 1).
; Solo documenta valores previstos para fases posteriores.
; La aplicación de Fase 1 NO se conecta al broker.
; Para uso local: copiar a config.ini y ajustar sin secretos.

[mqtt]
host = 192.168.137.1
port = 1884
; Usuario/clave del broker principal si exige auth (broker LAN).
; Reales solo en config.ini privado; vacíos = anónimo (desarrollo).
; user =
; password =

[topics]
sensores = agrotech/sensores
estado_gateway = agrotech/estado/gateway
botones = agrotech/botones
comandos_txt = agrotech/comandos/txt
estado_txt = agrotech/estado/txt
ack_txt = agrotech/ack/txt
velocidad_txt = agrotech/robot/velocidad/set
ack_velocidad = agrotech/ack/velocidad

[umbrales]
; Umbrales iniciales documentados para la interfaz de exposición.
temp_alta = 35.0
hum_baja = 20.0
presion_baja = 950.0
gas_alto = 500.0

[tiempos]
; Segundos sin ONLINE del TXT para volver a Desconectado (Fase 5A).
timeout_txt = 45

; Broker dedicado autenticado para el TXT (Fase 5B, OPCIONAL).
; Los valores reales viven en config.ini PRIVADO (excluido de versiones),
; nunca aquí. Sin [broker_txt], la app usa solo el broker local.
; [broker_txt]
; host = IP_LAN_DE_LA_PC
; port = 1884
; user = agrotech_txt
; password = (completar solo en config.ini privado)
