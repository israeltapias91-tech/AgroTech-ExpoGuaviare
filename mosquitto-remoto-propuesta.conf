# PROPUESTA INACTIVA — broker Mosquitto para acceso del TXT (Fase 5A).
#
# Este archivo NO se usa y NO habilita nada. Es solo la propuesta que el
# usuario deberá decidir y aplicar en otra etapa.
#
# Diagnóstico: el broker actual (mosquitto-local.conf) escucha solo en
# 127.0.0.1:1883, así que el TXT (10.183.218.207 u otra IP DHCP) no puede
# llegar a él. Sin cambiar esa configuración, no hay comunicación PC↔TXT.
#
# Propuesta separada (NO aplicar en Fase 5A):
#   1. Crear una configuración dedicada con un listener enlazado a UNA sola
#      IP LAN de la PC (p. ej. listener 1883 <IP_LAN_PC>) con
#      allow_anonymous false y password_file generado con mosquitto_passwd.
#   2. Crear usuario/contraseña DEDICADOS para el TXT (no reutilizar nada).
#   3. Decidir regla de firewall mínima (solo ese puerto, solo esa red).
#   4. Mantener el listener 127.0.0.1 de desarrollo separado o migrar con
#      cuidado; no mezclar perfiles sin autenticación.
#
# Acción del usuario requerida antes de continuar: aprobar el perfil
# autenticado, crear las credenciales fuera del repositorio y confirmar la
# IP LAN estable de la PC. Nada de esto se hizo en esta fase.
